    <text x="80" y="330" font-size="88" font-weight="700" letter-spacing="-4" fill="url(#accent)">Una placa.</text>
    <text x="80" y="422" font-size="88" font-weight="700" letter-spacing="-4">Cero humo.</text>
  </g>

  <g font-family="'Inter',sans-serif" fill="#9ca9bd">
